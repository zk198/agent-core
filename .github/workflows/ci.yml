name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.10.0"}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=agent_core --cov-report=term-missing --cov-fail-under=70
      - run: docker build -t agent-core:test .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-core:test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  fast-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout RAG gateway
        uses: actions/checkout@v6
        with:
          repository: zk198/rag-gateway
          ref: f1d3b42c1a0f58a73f546aee1240e6cb85226ac8
          path: rag-gateway

      - name: Run fast agent E2E
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: ./e2e/run-fast.sh

      - name: Upload fast E2E logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: agent-core-fast-e2e-logs
          path: ${{ runner.temp }}/rag-e2e-fast
          if-no-files-found: ignore
