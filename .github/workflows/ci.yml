name: CI
# Tool E2Es use the MCP-server container branches until merged.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: "0.10.0"}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=agent_core --cov-report=term-missing --cov-fail-under=70
      - run: docker build -t agent-core:test .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: agent-core:test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  fast-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Checkout AI gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/ai-gateway
          ref: main
          path: ai-gateway

      - name: Build AI gateway image
        run: docker build --progress=plain -t ai-gateway:e2e ./ai-gateway

      - name: Build agent-core image
        run: docker build --progress=plain -t agent-core:e2e .

      - name: Build mock LLM image
        run: docker build --progress=plain -t mock-llm:e2e -f e2e/mock-llm/Dockerfile .

      - name: Build mock retrieval image
        run: docker build --progress=plain -t mock-retrieval:e2e -f e2e/mock-retrieval/Dockerfile .

      - name: Start mock services
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh start-mocks

      - name: Start AI gateway
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh start-gateway

      - name: Start agent-core
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh start-agent

      - name: Wait for agent-core
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh wait-agent

      - name: Wait for AI gateway
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh wait-gateway

      - name: Discover MCP tools
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh discover

      - name: Run gateway session chat
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh gateway-chat

      - name: Run fast agent chat
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh chat

      - name: Run grounded answer stream
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh stream
      - name: Run gateway grounded answer stream
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh gateway-stream

      - name: Cleanup fast E2E services
        if: ${{ always() }}
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run-fast.sh cleanup

      - name: Upload fast E2E logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agent-core-fast-e2e-logs
          path: ${{ runner.temp }}/rag-e2e-fast
          if-no-files-found: ignore

  e2e-tools-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Checkout ai-infra
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/ai-infra
          ref: main
          path: ai-infra
      - name: Checkout rag-ingestion
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/rag-ingestion
          ref: main
          path: rag-ingestion
      - name: Checkout rag-indexer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/rag-indexer
          ref: main
          path: rag-indexer
      - name: Checkout rag-retrieval
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/rag-retrieval
          ref: main
          path: rag-retrieval
      - name: Checkout ai-gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/ai-gateway
          ref: main
          path: ai-gateway


      - name: Checkout agent-tools-web
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/agent-tools-web
          ref: fix/start-mcp-http-server
          path: agent-tools-web
      - name: Checkout agent-tools-code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/agent-tools-code
          ref: fix/start-mcp-http-server
          path: agent-tools-code
      - name: Arrange e2e tools rag Compose siblings
        run: |
          mv "$GITHUB_WORKSPACE/ai-infra" "$GITHUB_WORKSPACE/../ai-infra"
          mv "$GITHUB_WORKSPACE/rag-ingestion" "$GITHUB_WORKSPACE/../rag-ingestion"
          mv "$GITHUB_WORKSPACE/rag-indexer" "$GITHUB_WORKSPACE/../rag-indexer"
          mv "$GITHUB_WORKSPACE/rag-retrieval" "$GITHUB_WORKSPACE/../rag-retrieval"
          mv "$GITHUB_WORKSPACE/ai-gateway" "$GITHUB_WORKSPACE/../ai-gateway"
          mv "$GITHUB_WORKSPACE/agent-tools-web" "$GITHUB_WORKSPACE/../agent-tools-web"
          mv "$GITHUB_WORKSPACE/agent-tools-code" "$GITHUB_WORKSPACE/../agent-tools-code"

      - name: Run e2e tools rag
        env:
          RAG_JWT_SECRET: e2e-ci-only-secret
        run: sh ./e2e/run.sh

      - name: Upload e2e tools rag logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agent-core-e2e-tools-rag-logs
          path: ${{ runner.temp }}/e2e-tools-rag
          if-no-files-found: ignore

  e2e-tools-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Checkout web tool
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/agent-tools-web
          ref: 3a7d3bc39d8c4fcb900eaf1c895859aebea78a40
          path: agent-tools-web
      - name: Run e2e tools web
        env:
          AGENT_TOOLS_WEB_DIR: ${{ github.workspace }}/agent-tools-web
        run: sh ./e2e/run-tools-web.sh
      - name: Upload e2e tools web logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agent-core-e2e-tools-web-logs
          path: ${{ runner.temp }}/e2e-tools-web
          if-no-files-found: ignore

  e2e-tools-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Checkout code tool
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zk198/agent-tools-code
          ref: 9c90bbd57dbc860f76ee50ce2e07dd4f6d18a86f
          path: agent-tools-code
      - name: Run e2e tools code
        env:
          AGENT_TOOLS_CODE_DIR: ${{ github.workspace }}/agent-tools-code
        run: sh ./e2e/run-tools-code.sh
      - name: Upload e2e tools code logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agent-core-e2e-tools-code-logs
          path: ${{ runner.temp }}/e2e-tools-code
          if-no-files-found: ignore
