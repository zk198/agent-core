name: Regenerate uv.lock

on:
  workflow_dispatch:
    inputs:
      upgrade_all:
        description: 'Upgrade all packages in uv.lock? (true = uv lock --upgrade)'
        required: true
        default: false
        type: boolean
      packages:
        description: 'Specific packages to upgrade (space-separated, e.g. "authlib certifi dnspython")'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Update uv.lock
        env:
          UPGRADE_ALL: ${{ inputs.upgrade_all }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ "$UPGRADE_ALL" = "true" ]; then
            uv lock --upgrade
          elif [ -n "$PACKAGES" ]; then
            FLAGS=""
            for pkg in $PACKAGES; do
              FLAGS="$FLAGS --upgrade-package $pkg"
            done
            uv lock $FLAGS
          else
            uv lock
          fi

      - name: Verify uv.lock is valid and in sync
        run: uv lock --check

      - name: Commit and push uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore: update uv.lock"
            git push
          else
            echo "No changes to uv.lock"
          fi
