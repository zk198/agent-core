version: 2
updates:
  # 1. Updates pyproject.toml and regenerates uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Dubai"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      # Optional: bundles all updates into 1 weekly PR instead of 10 separate PRs
      python-dependencies:
        patterns:
          - "*"

  # 2. Keeps your SHA-pinned GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Dubai"
    groups:
      github-actions:
        patterns:
          - "*"
