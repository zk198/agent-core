[project]
name = "agent-core"
version = "0.1.0"
description = "Generic agent orchestration service using MCP tools and an OpenAI-compatible model gateway."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "fastmcp>=4.0.0,<5",
  "httpx>=0.28,<1",
  "openai>=1.107,<2",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]
[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
