services:
  agent-core:
    build: .
    expose: ["8000"]
    environment:
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-http://llm-gateway:8080/v1}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-local}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-local/default}
      AGENT_MCP_SERVER_NAMES: ${AGENT_MCP_SERVER_NAMES:-web,code,rag}
      AGENT_LAYA_ENABLED: ${AGENT_LAYA_ENABLED:-false}
      AGENT_LAYA_URL: ${AGENT_LAYA_URL:-http://laya:8000}
      AGENT_LAYA_TIMEOUT_SECONDS: ${AGENT_LAYA_TIMEOUT_SECONDS:-5}
      AGENT_LAYA_API_KEY: ${AGENT_LAYA_API_KEY:-}
      AGENT_LAYA_QUESTIONS_JSON: ${AGENT_LAYA_QUESTIONS_JSON:-}
      AGENT_LAYA_ENFORCE: ${AGENT_LAYA_ENFORCE:-false}
      AGENT_MCP_AUTH_TOKENS: ${AGENT_MCP_AUTH_TOKENS:-}
      AGENT_MCP_SERVERS: ${AGENT_MCP_SERVERS:-http://agent-tools-web:8001/mcp,http://agent-tools-code:8001/mcp,http://ai-gateway:8200/mcp/}
