services:
  ai-gateway:
    image: ai-gateway:e2e
    environment:
      RAG_RETRIEVAL_URL: http://mock-retrieval:8100
      RAG_INGESTION_URL: http://mock-retrieval:8100
      AI_AGENT_URL: http://agent-core:8000
      AI_POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?set RAG_JWT_SECRET}
      LAYA_ENABLED: "true"
      LAYA_URL: http://mock-laya:8000
      LAYA_TIMEOUT_SECONDS: "5"
    ports:
      - "18001:8200"
    depends_on:
      postgres:
        condition: service_healthy
      mock-retrieval:
        condition: service_started
      mock-laya:
        condition: service_healthy

  agent-core:
    image: agent-core:e2e
    ports:
      - "18000:8000"
    environment:
      AGENT_MODEL_BASE_URL: http://mock-llm:8080/v1
      AGENT_MODEL_API_KEY: e2e
      AGENT_MODEL_NAME: e2e/mock
      AGENT_LAYA_ENABLED: "true"
      AGENT_LAYA_URL: http://mock-laya:8000
      AGENT_LAYA_TIMEOUT_SECONDS: "5"
      AGENT_LAYA_QUESTIONS_JSON: '{"request_type":{"type":"choice","instructions":"Classify the request type.","criteria":{"knowledge":"asks for information or explanation","action":"asks to perform or plan an action","other":"other"}}}'
      AGENT_MCP_SERVERS: http://ai-gateway:8200/mcp/
      AGENT_MCP_AUTH_TOKENS: ${RAG_E2E_TOKEN:-}
      AGENT_MCP_SERVER_NAMES: rag
    depends_on:
      ai-gateway:
        condition: service_started
      mock-llm:
        condition: service_started
      mock-laya:
        condition: service_started

  mock-llm:
    image: mock-llm:e2e

  mock-retrieval:
    image: mock-retrieval:e2e

  mock-laya:
    image: mock-laya:e2e
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 2s
      retries: 15
